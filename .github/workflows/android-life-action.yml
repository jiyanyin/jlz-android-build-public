name: Android Parchment Life Action Preview

on:
  push:
    branches: [ci/life-action-sheet-20260929]
    paths:
      - 'native-android/**'
      - '.github/workflows/android-life-action.yml'
  workflow_dispatch:

concurrency:
  group: public-life-action-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify avatar contracts
        run: python native-android/tests/avatar-v1-host/test_avatar_v1.py
      - name: Verify native notification receipts and capture retry
        run: python native-android/tests/notification-receipt-host/test_receipt_contract.py
      - name: Verify welcome flow and portrait assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('native-android/app/src/main')
          activity = (root/'java/dev/jlz/presence/MainActivity.kt').read_text()
          app = (root/'java/dev/jlz/presence/ui/PresenceApp.kt').read_text()
          icon = (root/'res/drawable/ic_launcher_foreground.xml').read_text()
          assert 'freshLaunch = savedInstanceState == null' in activity
          assert 'PresenceRoute.Welcome' in activity
          assert 'PresenceRoute.Home' in app
          assert 'recordTimeline(' in app and 'daily_welcome' in app
          assert 'R.drawable.jlz_welcome_portrait' in app
          assert 'R.drawable.jlz_home_portrait' in app
          assert '@drawable/jlz_launcher_portrait' in icon
          assert '.background(ParchmentCarbon)' in app, "original dark portrait card missing"
          assert 'contentScale = ContentScale.Crop' in app, "original welcome crop missing"
          import subprocess
          blobs = {
              "welcome": "0c81990d5af8c3c05215828af2de9cb64ffce1a1",
              "home": "14543833bed2ee35e750b6f6ef46115455684903",
              "launcher": "be85417998b8fdbfb0c8749f69d57ee15f84fdd0",
          }
          for name, expected in blobs.items():
              asset = root / "res/drawable-nodpi" / f"jlz_{name}_portrait.webp"
              sha = subprocess.check_output(["git", "hash-object", str(asset)], text=True).strip()
              assert sha == expected, f"Wrong portrait asset {name}: {sha}"

          for name in ('welcome', 'home', 'launcher'):
              path = root / 'res/drawable-nodpi' / ('jlz_'+name+'_portrait.webp')
              data = path.read_bytes()
              assert len(data) > 2000 and data[:4] == b'RIFF' and data[8:12] == b'WEBP', str(path)
          assert not (root.parents[2]/'keystore/jlz-native-debug.keystore').exists()
          print('Welcome, portraits, icon, source-data preservation: OK')
          PY
      - name: Verify reused quick-note and native route contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("native-android/app/src/main/java/dev/jlz/presence")
          home=(src/"ui/PresenceApp.kt").read_text()
          more=(src/"ui/ParchmentMoreScreen.kt").read_text()
          original=(src/"ui/BetweenScreen.kt").read_text()
          quick=(src/"share/SharedItemRepository.kt").read_text()
          for key in [
              'IceButton("随手记"',
              'IceButton("状态灯"',
              'IceButton("聊天"',
              'IceButton("伴读"',
              'IceButton("粉笔"',
              'IceButton("今日生活"',
              'StudyShortcuts.openBanduread(context)',
              'StudyShortcuts.openFenbi(context)',
              'is PresenceRoute.Today -> LifeTodayScreen()',
              'QAvatarHomeControls()',
              'StatusLightHomeCard()',
              'R.drawable.jlz_home_portrait',
              'R.drawable.jlz_welcome_portrait',
          ]:
              assert key in home, key
          assert 'IceButton("随手记 · 写给老公"' in more
          assert 'IceButton("本机速记（仅本地）"' in more
          assert 'IceButton("带着老公 · 同行"' in more
          assert 'var needsResponse by remember { mutableStateOf(true) }' in original
          assert '.put("needs_response", responseWanted)' in original
          assert '"between_moment"' in original
          assert 'fun recordQuickNote(text: String)' in quick
          assert (src/"ui/TimeChainScreen.kt").exists()
          assert (src/"ui/StatusLightEditor.kt").exists()
          assert (src/"ui/LifeTodayScreen.kt").exists()
          gradle=Path("native-android/app/build.gradle.kts").read_text()
          assert "versionCode = 2026092909" in gradle
          print("Parchment shortcuts and source contracts: PASS")
          PY

      - name: Verify life action event and source-label contracts
        run: python native-android/tests/life-action-host/test_life_action_contract.py

      - name: Build debug APK
        working-directory: native-android
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Re-sign APK with stable private certificate
        if: success()
        shell: bash
        env:
          JLZ_DEBUG_KEYSTORE_BASE64: ${{ secrets.JLZ_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${JLZ_DEBUG_KEYSTORE_BASE64:-}"
          mkdir -p /tmp/jlz-signing
          printf '%s' "$JLZ_DEBUG_KEYSTORE_BASE64" | base64 --decode > /tmp/jlz-signing/jlz-native-debug.keystore
          apk="native-android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/jlz-signing/jlz-native-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$apk"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          rm -f /tmp/jlz-signing/jlz-native-debug.keystore
      - name: Upload isolated test APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JLZ-Presence-Life-Action-2026092910
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

