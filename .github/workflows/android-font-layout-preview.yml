name: Android Cycle Font Layout Preview

on:
  push:
    branches: [ci/parchment-font-layout-cycle-20260929]
    paths:
      - 'native-android/**'
      - '.github/workflows/android-font-layout-preview.yml'
  workflow_dispatch:

concurrency:
  group: public-font-layout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify source-level font, safe area and preserved cycle contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ui = Path("native-android/app/src/main/java/dev/jlz/presence/ui")
          app = (ui / "PresenceApp.kt").read_text()
          chat = (ui / "ParchmentChatScreen.kt").read_text()
          font = (ui / "theme/WorldFonts.kt").read_text()
          text = (ui / "components/WorldText.kt").read_text()
          cycle = Path("native-android/app/src/main/java/dev/jlz/presence/life/CycleReminderEngine.kt").read_text()
          gradle = Path("native-android/app/build.gradle.kts").read_text()
          assert "WindowInsets.safeDrawing" in app and "consumeWindowInsets(padding)" in app
          assert "shortcuts.chunked(columns)" in app
          assert "maxWidth * 0.88f" in chat
          assert "WorldFonts.greatVibes" in chat
          for v in ("playfair_display","great_vibes","inter","noto_serif_sc"):
              assert "R.font." + v in font
          assert "Character.UnicodeScript.HAN" in text
          assert "WorldFonts.chineseSerif" in text
          assert "CycleReminderEngine" in cycle
          assert "versionCode = 2026092923" in gradle
          assert "prepareWorldFonts" in gradle
          print("Font/layout + cycle source contracts: PASS")
          PY

      - name: Verify avatar regression
        run: python native-android/tests/avatar-v1-host/test_avatar_v1.py

      - name: Verify native notification and screenshot receipts
        run: python native-android/tests/notification-receipt-host/test_receipt_contract.py

      - name: Verify life action event contracts
        run: python native-android/tests/life-action-host/test_life_action_contract.py

      - name: Build Debug APK
        working-directory: native-android
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Re-sign APK with stable private certificate
        if: success()
        shell: bash
        env:
          JLZ_DEBUG_KEYSTORE_BASE64: ${{ secrets.JLZ_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${JLZ_DEBUG_KEYSTORE_BASE64:-}"
          mkdir -p /tmp/jlz-signing
          printf '%s' "$JLZ_DEBUG_KEYSTORE_BASE64" | base64 --decode > /tmp/jlz-signing/jlz-native-debug.keystore
          apk="native-android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/jlz-signing/jlz-native-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$apk"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          rm -f /tmp/jlz-signing/jlz-native-debug.keystore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JLZ-Presence-Font-Layout-Cycle-2026092923
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish separate pre-release (do not change android-native-latest)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          apk="native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          cp "$apk" /tmp/JLZ-Presence-Font-Layout-Cycle-2026092923.apk
          (cd /tmp && sha256sum JLZ-Presence-Font-Layout-Cycle-2026092923.apk > JLZ-Presence-Font-Layout-Cycle-2026092923.sha256)
          tag="android-font-layout-cycle-preview-20260929"
          notes="Independent signed preview, v2026092923: menstrual reminder reader and UI font/layout fixes. Offline-at-runtime OFL fonts. Existing app id and stable signing certificate preserved. No private Runtime, local messages, or secrets copied into this public mirror. Requires real-device QA before any production merge."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" /tmp/JLZ-Presence-Font-Layout-Cycle-2026092923.apk /tmp/JLZ-Presence-Font-Layout-Cycle-2026092923.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --title "JLZ Presence · font/layout + cycle preview" --notes "$notes" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" /tmp/JLZ-Presence-Font-Layout-Cycle-2026092923.apk /tmp/JLZ-Presence-Font-Layout-Cycle-2026092923.sha256 --target "$GITHUB_SHA" --title "JLZ Presence · font/layout + cycle preview" --notes "$notes" --prerelease --repo "$GITHUB_REPOSITORY"
          fi
