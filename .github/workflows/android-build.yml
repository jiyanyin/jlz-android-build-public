name: Public Android Build

on:
  push:
    branches: [main, runtime-slim-20260930]
    paths:
      - 'native-android/**'
      - 'between-worlds-prod/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'native-android/**'
      - 'between-worlds-prod/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      private_release_id:
        description: 'Draft release ID containing AES-GCM encrypted private poses; empty for ordinary build'
        required: false
        type: string

concurrency:
  group: public-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: ${{ inputs.private_release_id != '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage authenticated private resources
        if: github.event_name == 'workflow_dispatch' && inputs.private_release_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.private_release_id }}
          WB_PRIVATE_BUILD_KEY: ${{ secrets.WB_PRIVATE_BUILD_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/private-release.json"
          test "$(jq -r .draft "$RUNNER_TEMP/private-release.json")" = true
          asset=$(jq -r '.assets[] | select(.name=="q-poses.enc") | .id' "$RUNNER_TEMP/private-release.json")
          test -n "$asset"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/q-poses.enc"
          node scripts/private-build-envelope.mjs decrypt "$RUNNER_TEMP/q-poses.enc" "$RUNNER_TEMP/q-poses.zip"
          python - "$RUNNER_TEMP/q-poses.zip" <<'PY'
          import sys, zipfile, pathlib, json, hashlib
          target=pathlib.Path('native-android/app/src/main/assets/avatar/packs').resolve()
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert len(z.infolist()) == 116
              assert sum(i.file_size for i in z.infolist()) < 20_000_000
              for i in z.infolist():
                  p=(target/i.filename).resolve()
                  assert p.is_relative_to(target) and (i.filename == 'index.json' or i.filename.startswith('poses/'))
                  p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(z.read(i))
          packs=json.loads((target/'index.json').read_text())['packs']
          assert len(packs)==4 and len(list(target.rglob('*.webp')))==115
          print('Four private packs staged; 115 single poses; no reference sheets.')
          PY
          rm -f "$RUNNER_TEMP/q-poses.zip" "$RUNNER_TEMP/q-poses.enc"

      - name: Package unchanged WebShell UI for offline startup
        shell: bash
        run: |
          npm install --prefix between-worlds-prod --no-audit --no-fund
          npm run build --prefix between-worlds-prod
          mkdir -p native-android/app/src/main/assets/world-between
          cp -R between-worlds-prod/dist/. native-android/app/src/main/assets/world-between/

      - name: Verify screenshot traffic policy
        working-directory: native-android
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Android static checks
        if: always()
        working-directory: native-android
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --no-daemon
          result=$?
          cat app/build/reports/lint-results-debug.txt
          exit $result

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-unit-tests
          path: native-android/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 14

      - name: Build Debug APK
        working-directory: native-android
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Re-sign APK with stable private certificate
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/runtime-slim-20260930' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.private_release_id != ''))
        shell: bash
        env:
          JLZ_DEBUG_KEYSTORE_BASE64: ${{ secrets.JLZ_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${JLZ_DEBUG_KEYSTORE_BASE64:-}"
          mkdir -p /tmp/jlz-signing
          trap 'rm -f /tmp/jlz-signing/jlz-native-debug.keystore' EXIT
          printf '%s' "$JLZ_DEBUG_KEYSTORE_BASE64" | base64 --decode > /tmp/jlz-signing/jlz-native-debug.keystore
          apk="native-android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/jlz-signing/jlz-native-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$apk"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          "$APKSIGNER" verify --print-certs "$apk" | grep -q 'a129340ee73c5ef1d05808258582a83dfa53d4191e0bd49b5516ef083f3e5ef5'
          rm -f /tmp/jlz-signing/jlz-native-debug.keystore

      - name: Upload APK artifact
        if: success() && inputs.private_release_id == '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/runtime-slim-20260930' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/upload-artifact@v4
        with:
          name: JLZ-Presence-${{ github.sha }}
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Encrypt private signed deliverable
        if: success() && github.event_name == 'workflow_dispatch' && inputs.private_release_id != ''
        env:
          WB_PRIVATE_BUILD_KEY: ${{ secrets.WB_PRIVATE_BUILD_KEY }}
        run: node scripts/private-build-envelope.mjs encrypt native-android/app/build/outputs/apk/debug/app-debug.apk World-Between-private.apk.enc

      - name: Upload encrypted deliverable only
        if: success() && github.event_name == 'workflow_dispatch' && inputs.private_release_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: World-Between-private-encrypted
          path: World-Between-private.apk.enc
          retention-days: 3

      - name: Remove private runner resources
        if: always() && github.event_name == 'workflow_dispatch' && inputs.private_release_id != ''
        run: rm -rf native-android/app/src/main/assets/avatar/packs native-android/app/build

      - name: Publish latest APK release
        if: success() && inputs.private_release_id == '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          apk="native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          build_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*$/\1/p' native-android/app/build.gradle.kts | head -n 1)"
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*$/\1/p' native-android/app/build.gradle.kts | head -n 1)"
          cp "$apk" /tmp/JLZ-Presence-latest.apk
          sha256sum /tmp/JLZ-Presence-latest.apk > /tmp/JLZ-Presence-latest-SHA256.txt
          notes="Public build mirror. Android version: ${version_name}; versionCode: ${build_code}. Private Runtime/server sources are not included in this repository."
          if gh release view android-native-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-native-latest /tmp/JLZ-Presence-latest.apk /tmp/JLZ-Presence-latest-SHA256.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit android-native-latest --title "JLZ Presence · Android latest" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-native-latest /tmp/JLZ-Presence-latest.apk /tmp/JLZ-Presence-latest-SHA256.txt --target "$GITHUB_SHA" --title "JLZ Presence · Android latest" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          fi
