name: IB UI Lab (isolated / no production release)

on:
  push:
    branches: [ib-ui-lab-20260928]
    paths:
      - 'native-android/ib-ui-lab/**'
      - 'native-android/settings.gradle.kts'
      - '.github/workflows/ib-ui-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ib-ui-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch immutable upstream IB UI + required license files
        shell: bash
        run: |
          set -euo pipefail
          REV=040bf2a57d3f4efb2a79689a29a95086d6b8b1be
          BASE="https://raw.githubusercontent.com/Sui-IB/InternalBeyond-Mobile/$REV"
          DEST="native-android/ib-ui-lab/src/main/assets/ib"
          mkdir -p "$DEST"
          for file in \
            index.html \
            apps/catalog.js \
            apps/catalog.json \
            apps/ib-app-cinema.js \
            ib-sw.js \
            manifest.webmanifest \
            icon-192.png \
            icon-512.png \
            LICENSE \
            COPYRIGHT.md; do
            mkdir -p "$DEST/$(dirname "$file")"
            curl --fail --location --silent --show-error --retry 3 --max-time 150 "$BASE/$file" -o "$DEST/$file"
            test -s "$DEST/$file"
          done
          test "$(wc -c < "$DEST/index.html")" -eq 3669901
          grep -q 'PolyForm Noncommercial License 1.0.0' "$DEST/LICENSE"
          grep -q '视觉素材许可' "$DEST/COPYRIGHT.md"
          echo "UI source pinned to $REV"
          du -sh "$DEST"

      - name: Build isolated lab APK (separate package)
        working-directory: native-android
        shell: bash
        run: gradle :ib-ui-lab:assembleDebug --no-daemon --stacktrace

      - name: Upload lab-only APK (NEVER release to production)
        uses: actions/upload-artifact@v4
        with:
          name: IB-UI-Lab-test-only
          path: native-android/ib-ui-lab/build/outputs/apk/debug/ib-ui-lab-debug.apk
          if-no-files-found: error
          retention-days: 7
