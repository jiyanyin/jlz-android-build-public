name: World Between Web Check

on:
  push:
    branches: ["main"]
    paths:
      - "world-between-web/**"
      - ".github/workflows/world-between-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check world-between-web/app.js
      - name: Verify required frontend files
        run: |
          test -s world-between-web/index.html
          test -s world-between-web/styles.css
          test -s world-between-web/app.js
          test -s world-between-web/manifest.webmanifest
          grep -q "状态灯" world-between-web/index.html
          grep -q "随手记" world-between-web/index.html
          grep -q "此刻我在" world-between-web/index.html
          grep -q "Runtime 待连接" world-between-web/index.html
      - name: Smoke-test static serving
        run: |
          python3 -m http.server 8765 --directory world-between-web >/tmp/world-between-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8765/index.html | grep -q "世界之间"
          curl --fail --silent http://127.0.0.1:8765/styles.css >/dev/null
          curl --fail --silent http://127.0.0.1:8765/app.js >/dev/null
