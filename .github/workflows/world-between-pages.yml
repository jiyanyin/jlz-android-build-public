name: Deploy World Between Web

on:
  push:
    branches: ["main"]
    paths:
      - "world-between-web/**"
      - ".github/workflows/world-between-pages.yml"
  pull_request:
    paths:
      - "world-between-web/**"
      - ".github/workflows/world-between-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "world-between-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check world-between-web/runtime-client.js
          node --check world-between-web/app.js

      - name: Verify required frontend files
        run: |
          test -s world-between-web/index.html
          test -s world-between-web/styles.css
          test -s world-between-web/app.js
          test -s world-between-web/runtime-client.js
          test -s world-between-web/manifest.webmanifest
          grep -q "状态灯" world-between-web/index.html
          grep -q "随手记" world-between-web/index.html
          grep -q "此刻我在" world-between-web/index.html
          grep -q "网页专用令牌" world-between-web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: world-between-web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
