name: Android Parchment Transparent Portraits

on:
  push:
    branches: [ci/parchment-ui-v1-20260929]
    paths:
      - 'native-android/**'
      - '.github/workflows/android-parchment-ui-v1.yml'
  workflow_dispatch:

concurrency:
  group: public-parchment-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore actual alpha for owner portraits
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            "numpy>=1.26,<2" "opencv-python-headless>=4.10,<4.11" "Pillow>=10"
          python3 native-android/tools/prepare_portraits.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root = Path("native-android/app/src/main/res/drawable-nodpi")
          for name in ("welcome", "home", "launcher"):
              path = root / f"jlz_{name}_portrait.webp"
              img = Image.open(path)
              assert img.mode == "RGBA" and img.getchannel("A").getextrema()[0] == 0, str(path)
              assert img.getchannel("A").getextrema()[1] == 255, str(path)
          print("All three portraits contain true transparent pixels.")
          PY
          # Keep the canonical public mirror deployable even without the CI
          # preprocessing step on future builds. No image is a keystore/token.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-android/app/src/main/res/drawable-nodpi/jlz_*_portrait.webp
          if ! git diff --cached --quiet; then
            git commit -m "fix(assets): replace black-backed portraits with transparent WebP"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify avatar contracts
        run: python native-android/tests/avatar-v1-host/test_avatar_v1.py
      - name: Verify native notification receipts and capture retry
        run: python native-android/tests/notification-receipt-host/test_receipt_contract.py
      - name: Verify welcome flow and portrait assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('native-android/app/src/main')
          activity = (root/'java/dev/jlz/presence/MainActivity.kt').read_text()
          app = (root/'java/dev/jlz/presence/ui/PresenceApp.kt').read_text()
          icon = (root/'res/drawable/ic_launcher_foreground.xml').read_text()
          assert 'freshLaunch = savedInstanceState == null' in activity
          assert 'PresenceRoute.Welcome' in activity
          assert 'PresenceRoute.Home' in app
          assert 'recordTimeline(' in app and 'daily_welcome' in app
          assert 'R.drawable.jlz_welcome_portrait' in app
          assert 'R.drawable.jlz_home_portrait' in app
          assert '@drawable/jlz_launcher_portrait' in icon
          for name in ('welcome', 'home', 'launcher'):
              path = root / 'res/drawable-nodpi' / ('jlz_'+name+'_portrait.webp')
              data = path.read_bytes()
              assert len(data) > 2000 and data[:4] == b'RIFF' and data[8:12] == b'WEBP', str(path)
          assert not (root.parents[2]/'keystore/jlz-native-debug.keystore').exists()
          print('Welcome, portraits, icon, source-data preservation: OK')
          PY
      - name: Build debug APK
        working-directory: native-android
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Re-sign APK with stable private certificate
        if: success()
        shell: bash
        env:
          JLZ_DEBUG_KEYSTORE_BASE64: ${{ secrets.JLZ_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${JLZ_DEBUG_KEYSTORE_BASE64:-}"
          mkdir -p /tmp/jlz-signing
          printf '%s' "$JLZ_DEBUG_KEYSTORE_BASE64" | base64 --decode > /tmp/jlz-signing/jlz-native-debug.keystore
          apk="native-android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/jlz-signing/jlz-native-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$apk"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          rm -f /tmp/jlz-signing/jlz-native-debug.keystore
      - name: Upload isolated test APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JLZ-Presence-Transparent-Portraits-2026092907
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish signed parchment UI preview APK
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          cp "$apk" /tmp/JLZ-Presence-Transparent-Portraits-2026092907.apk
          sha256sum /tmp/JLZ-Presence-Transparent-Portraits-2026092907.apk > /tmp/JLZ-Presence-Transparent-Portraits-2026092907-SHA256.txt
          tag="android-parchment-transparent-20260929"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" /tmp/JLZ-Presence-Transparent-Portraits-2026092907.apk /tmp/JLZ-Presence-Transparent-Portraits-2026092907-SHA256.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --prerelease --title "JLZ Presence · Transparent Portraits preview 2026092907" --repo "$GITHUB_REPOSITORY"
            gh release delete-asset "$tag" JLZ-Presence-QAvatar-Controls-2026092904.apk --yes --repo "$GITHUB_REPOSITORY" || true
            gh release delete-asset "$tag" JLZ-Presence-QAvatar-Controls-2026092904-SHA256.txt --yes --repo "$GITHUB_REPOSITORY" || true
          else
            gh release create "$tag" /tmp/JLZ-Presence-Transparent-Portraits-2026092907.apk /tmp/JLZ-Presence-Transparent-Portraits-2026092907-SHA256.txt --prerelease --target "$GITHUB_SHA" --title "JLZ Presence · Transparent Portraits preview 2026092907" --notes "Signed Android 0.4.6 PREVIEW: portraits have true alpha and black portrait panels removed. No Runtime/data schema changes. Test upgrade before daily use." --repo "$GITHUB_REPOSITORY"
          fi
