name: Android Parchment UI V1 public build

on:
  push:
    branches: [ci/parchment-ui-v1-20260929]
    paths:
      - 'native-android/**'
      - '.github/workflows/android-parchment-ui-v1.yml'
  workflow_dispatch:

concurrency:
  group: public-parchment-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify avatar contracts
        run: python native-android/tests/avatar-v1-host/test_avatar_v1.py
      - name: Verify native notification receipts and capture retry
        run: python native-android/tests/notification-receipt-host/test_receipt_contract.py
      - name: Build debug APK
        working-directory: native-android
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Re-sign APK with stable private certificate
        if: success()
        shell: bash
        env:
          JLZ_DEBUG_KEYSTORE_BASE64: ${{ secrets.JLZ_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${JLZ_DEBUG_KEYSTORE_BASE64:-}"
          mkdir -p /tmp/jlz-signing
          printf '%s' "$JLZ_DEBUG_KEYSTORE_BASE64" | base64 --decode > /tmp/jlz-signing/jlz-native-debug.keystore
          apk="native-android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/jlz-signing/jlz-native-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$apk"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          rm -f /tmp/jlz-signing/jlz-native-debug.keystore
      - name: Upload isolated test APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JLZ-Presence-Parchment-Preview-2026092905
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish signed parchment UI preview APK
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          cp "$apk" /tmp/JLZ-Presence-QAvatar-Controls-2026092904.apk
          sha256sum /tmp/JLZ-Presence-QAvatar-Controls-2026092904.apk > /tmp/JLZ-Presence-QAvatar-Controls-2026092904-SHA256.txt
          tag="android-parchment-preview-20260929"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" /tmp/JLZ-Presence-QAvatar-Controls-2026092904.apk /tmp/JLZ-Presence-QAvatar-Controls-2026092904-SHA256.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" /tmp/JLZ-Presence-QAvatar-Controls-2026092904.apk /tmp/JLZ-Presence-QAvatar-Controls-2026092904-SHA256.txt --target "$GITHUB_SHA" --title "JLZ Presence · Parchment UI preview 2026092905" --notes "Signed Android 0.4.4 PREVIEW: parchment interface built on QAvatar V1. Please test before using as production." --repo "$GITHUB_REPOSITORY"
          fi
