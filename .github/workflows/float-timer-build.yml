name: Build JLZ Float Timer

on:
  push:
    branches: [main]
    paths:
      - 'archives/world-between/float-timer/**'
      - '.github/workflows/float-timer-build.yml'
  workflow_dispatch:

concurrency:
  group: jlz-float-timer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jlz-float-timer
          mkdir -p /tmp/jlz-float-timer
          unzip -q archives/world-between/float-timer/JLZFloatTimer-v0.3-source.zip -d /tmp/jlz-float-timer
          test -f /tmp/jlz-float-timer/JLZFloatTimer/settings.gradle

      - name: Build debug APK
        working-directory: /tmp/jlz-float-timer/JLZFloatTimer
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Re-sign APK with stable certificate
        shell: bash
        env:
          JLZ_DEBUG_KEYSTORE_BASE64: ${{ secrets.JLZ_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          apk="/tmp/jlz-float-timer/JLZFloatTimer/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          if [ -n "${JLZ_DEBUG_KEYSTORE_BASE64:-}" ]; then
            mkdir -p /tmp/jlz-signing
            printf '%s' "$JLZ_DEBUG_KEYSTORE_BASE64" | base64 --decode > /tmp/jlz-signing/jlz-native-debug.keystore
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
            "$APKSIGNER" sign               --ks /tmp/jlz-signing/jlz-native-debug.keystore               --ks-key-alias androiddebugkey               --ks-pass pass:android               --key-pass pass:android               "$apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            rm -f /tmp/jlz-signing/jlz-native-debug.keystore
          fi

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail
          apk="/tmp/jlz-float-timer/JLZFloatTimer/app/build/outputs/apk/debug/app-debug.apk"
          cp "$apk" /tmp/JLZ-Float-Timer-v0.3.apk
          sha256sum /tmp/JLZ-Float-Timer-v0.3.apk > /tmp/JLZ-Float-Timer-v0.3-SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JLZ-Float-Timer-v0.3
          path: |
            /tmp/JLZ-Float-Timer-v0.3.apk
            /tmp/JLZ-Float-Timer-v0.3-SHA256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest timer APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="jlz-float-timer-latest"
          notes="JLZ Float Timer v0.3 · G 方案等宽数字字体；修复大字体缩放导致三行堆叠。"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" /tmp/JLZ-Float-Timer-v0.3.apk /tmp/JLZ-Float-Timer-v0.3-SHA256.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --title "JLZ Float Timer · latest" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" /tmp/JLZ-Float-Timer-v0.3.apk /tmp/JLZ-Float-Timer-v0.3-SHA256.txt --target "$GITHUB_SHA" --title "JLZ Float Timer · latest" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          fi
