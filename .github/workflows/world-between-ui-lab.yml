name: World Between V2 UI Lab (test only)

on:
  push:
    branches: [world-between-v2-ui-20260928]
    paths:
      - 'native-android/world-between-ui-lab/**'
      - 'native-android/settings.gradle.kts'
      - '.github/workflows/world-between-ui-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-between-v2-ui-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Assert offline and independent prototype
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          base = Path("native-android/world-between-ui-lab")
          doc = (base / "src/main/assets/index_v3.html").read_text(encoding="utf8")
          manifest = (base / "src/main/AndroidManifest.xml").read_text(encoding="utf8")
          class Test(HTMLParser):
              def __init__(self): super().__init__(); self.ids = set(); self.duplicates = set()
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id":
                          if value in self.ids: self.duplicates.add(value)
                          self.ids.add(value)
          parser = Test(); parser.feed(doc)
          assert not parser.duplicates, parser.duplicates
          assert "<!doctype html>" in doc.lower()
          for expected in ("当前安排", "你我之间", "状态灯", "纪临洲状态", "回声", "粉笔", "伴读", "记一下此刻", "健康与生活", "共历", "专注"):
              assert expected in doc, expected
          for forbidden in ("android.permission.INTERNET", "android.permission.ACCESS_FINE_LOCATION", "android.permission.BIND_ACCESSIBILITY_SERVICE"):
              assert forbidden not in manifest, forbidden
          assert 'dev.jlz.worldbetween.uilab' in (base/"build.gradle.kts").read_text()
          print("ui-lab-static-checks: PASS")
          PY

      - name: Check embedded prototype JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          doc=Path("native-android/world-between-ui-lab/src/main/assets/index_v3.html").read_text()
          js=re.findall(r"<script>(.*?)</script>",doc,re.S)
          assert len(js)==1, "expected exactly one inline app script"
          Path("/tmp/world-between-v3-check.js").write_text(js[0])
          print("embedded-js-extracted",len(js[0]))
          PY
          node --check /tmp/world-between-v3-check.js

      - name: Fetch licensed typefaces and build lightweight UI subsets
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="native-android/world-between-ui-lab/src/main/assets"
          mkdir -p "$ASSET_DIR/fonts"
          curl -fL --retry 3 --connect-timeout 15 --max-time 240 \
            "https://github.com/lxgw/LxgwWenKai-Screen/releases/download/v1.522/LXGWWenKaiScreen.ttf" \
            -o /tmp/LXGWWenKaiScreen.ttf
          curl -fL --retry 3 --connect-timeout 15 --max-time 240 \
            "https://raw.githubusercontent.com/adobe-fonts/source-han-sans/a4f7cf94edfb9d7ffbdfc4841de276358bd7e0f2/SubsetOTF/CN/SourceHanSansCN-Regular.otf" \
            -o /tmp/SourceHanSansCN-Regular.otf
          curl -fL "https://raw.githubusercontent.com/lxgw/LxgwWenKai-Screen/34f2c5602eb51d7455a0032c56ea9b0029edab53/OFL.txt" -o "$ASSET_DIR/fonts/LXGW-OFL.txt"
          curl -fL "https://raw.githubusercontent.com/adobe-fonts/source-han-sans/a4f7cf94edfb9d7ffbdfc4841de276358bd7e0f2/LICENSE.txt" -o "$ASSET_DIR/fonts/SourceHanSans-LICENSE.txt"
          python3 -m pip install --quiet 'fonttools[woff]>=4.54,<5'
          python3 - <<'PY'
          from pathlib import Path
          ui=Path("native-android/world-between-ui-lab/src/main/assets/index_v3.html").read_text()
          # Include all visible Chinese labels/punctuation and ASCII used by the interface.
          glyphs=set(c for c in ui if ord(c)>127)
          glyphs.update(chr(i) for i in range(32,127))
          Path("/tmp/world-between-chars.txt").write_text("".join(sorted(glyphs)))
          print("font subset glyph repertoire",len(glyphs))
          PY
          pyftsubset /tmp/LXGWWenKaiScreen.ttf \
            --text-file=/tmp/world-between-chars.txt --flavor=woff2 --no-hinting \
            --output-file="$ASSET_DIR/fonts/wenkai-ui.woff2"
          pyftsubset /tmp/SourceHanSansCN-Regular.otf \
            --text-file=/tmp/world-between-chars.txt --flavor=woff2 --no-hinting \
            --output-file="$ASSET_DIR/fonts/sourcehan-ui.woff2"
          test -s "$ASSET_DIR/fonts/wenkai-ui.woff2"
          test -s "$ASSET_DIR/fonts/sourcehan-ui.woff2"
          du -h "$ASSET_DIR/fonts/"*

      - name: Assemble isolated Android UI preview
        working-directory: native-android
        run: gradle :world-between-ui-lab:assembleDebug --no-daemon --stacktrace

      - name: Upload preview APK (not production)
        uses: actions/upload-artifact@v4
        with:
          name: World-Between-V2-UI-PREVIEW
          path: native-android/world-between-ui-lab/build/outputs/apk/debug/world-between-ui-lab-debug.apk
          if-no-files-found: error
          retention-days: 7
